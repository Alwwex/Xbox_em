name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (build, unit + guest execution tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            ninja-build gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload xbem (Linux / WSL2)
        uses: actions/upload-artifact@v4
        with:
          name: xbem-linux-x64
          path: |
            build/bin/xbem
            tools/xbdp/xbdp.py
            README.md

  windows:
    name: Windows (analysis tools, unit tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DXBEM_BUILD_GUEST_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload xbem.exe (Windows, analysis tools)
        uses: actions/upload-artifact@v4
        with:
          name: xbem-windows-x64
          path: |
            build/bin/Release/xbem.exe
            tools/xbdp/xbdp.py
            README.md
